      const errorEl = document.getElementById('codeError');

        unlockedLevel = 'INTRO';
        localStorage.setItem('atem_unlock_code', code);
        showApp();
      } else if (code === 'PRO2026') {
        unlockedLevel = 'PREMIUM';

        localStorage.setItem('atem_unlock_code', code);
        showApp();
      } else {
        errorEl.textContent = 'Code nicht erkannt. Versuche es nochmal.';
      }

            <p>${ex.category} • ${ex.duration} Min</p>
            ${isLocked ? '<p style="color: #C85A30;">🔒 Premium</p>' : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

      const ex = allExercises.find(e => e.id === id);
      if (!ex) return;

      document.getElementById('modalTitle').textContent = ex.title;
      document.getElementById('modalDescription').textContent = `${ex.category} • ${ex.duration} Minuten`;
      document.getElementById('modalImage').src = `/public/images/exercises/${ex.file}`;
      document.getElementById('modalDetails').innerHTML = `<p>Folge den Anweisungen auf dem Bild. ${ex.duration} Minuten für dich selbst.</p>`;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function openFullscreen(event) {
      event.stopPropagation();
      const img = document.getElementById('modalImage');
      const fullscreenImg = document.getElementById('fullscreenImage');
      fullscreenImg.src = img.src;
      document.getElementById('fullscreenViewer').classList.add('active');
    }

    function closeFullscreen() {
      document.getElementById('fullscreenViewer').classList.remove('active');
    }

    // ESC zum Schließen
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeFullscreen();
      }
    });

    function changeCode() {
      localStorage.removeItem('atem_unlock_code');
      document.getElementById('welcomeScreen').style.display = 'block';
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('codeInput').value = '';
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('atem_unlock_code');
      if (saved) {
        if (saved === 'INTRO2024') {
          unlockedLevel = 'INTRO';
          showApp();
        } else if (saved === 'PRO2026') {
          unlockedLevel = 'PREMIUM';
          allExercises = [...introExercises, ...generatePremiumScaffold()];
          showApp();
        }
      }
    });

    // PWA: Service Worker
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('/service-worker.js').catch(e => console.log('SW:', e.message));
    }

    // PWA: Install Prompt
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      const btn = document.createElement('button');
      btn.textContent = '📱 Zur Startseite hinzufügen';
      btn.style.cssText = 'padding:10px 16px; background:#C5A55C; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px; margin:1rem 0;';
      btn.onclick = () => e.prompt();
      document.querySelector('.app-header').appendChild(btn);
    });
  </script>
</body>
</html>
