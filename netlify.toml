# Netlify Configuration for Atem-Pause App

[build]
# No build process needed - this is a static HTML file
command = ""
publish = "."

# Set proper headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=3600"

# Redirect root to the HTML file (if you want to serve from root)
[[redirects]]
from = "/"
to = "/nervensystem-app-mit-illustrationen.html"
status = 200

# Make sure HTML files are served with correct content type
[[headers]]
for = "*.html"
[headers.values]
Content-Type = "text/html; charset=UTF-8"
