<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dein Nervensystem - ATEM-PAUSE</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7A8E8A">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f9f8 0%, #faf8f6 100%);
      color: #5A6B68;
      min-height: 100vh;
    }

    .app-header {
      background: white;
      border-bottom: 1px solid #C7A2A8;
      padding: 1.5rem 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .app-header h1 {
      font-size: 22px;
      font-weight: 500;
      color: #7A8E8A;
      margin-bottom: 0.5rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: 3rem;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7A8E8A;
      font-weight: 600;
      margin: 2rem 0 1rem 0;
    }

    .exercise-card {
      background: white;
      border: 1px solid #C7A2A8;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .exercise-card:hover:not(.locked) {
      background: rgba(232, 240, 237, 0.3);
      border-color: #B8949E;
    }

    .exercise-card.locked {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .exercise-card h3 {
      font-size: 15px;
      font-weight: 500;
      color: #7A8E8A;
      margin-bottom: 0.3rem;
    }

    .exercise-card p {
      font-size: 13px;
      color: #B8949E;
      margin-bottom: 0.5rem;
    }

    .exercise-meta {
      font-size: 12px;
      color: #C5A55C;
      font-weight: 500;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
      align-items: flex-end;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 12px 12px 0 0;
      padding: 2rem 1.5rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 500;
      color: #7A8E8A;
      margin-bottom: 0.5rem;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 24px;
      color: #7A8E8A;
      cursor: pointer;
    }

    .unlock-section {
      background: rgba(232, 240, 237, 0.5);
      border: 1px solid #C7A2A8;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      text-align: center;
    }

    .unlock-input {
      width: 100%;
      padding: 11px;
      border: 1px solid #C7A2A8;
      border-radius: 8px;
      font-size: 14px;
      margin: 1rem 0;
      font-family: monospace;
    }

    .unlock-button {
      width: 100%;
      padding: 12px;
      background: #B8949E;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .unlock-button:hover {
      background: #A07D89;
    }

    .upgrade-banner {
      background: linear-gradient(135deg, rgba(184, 148, 158, 0.1), rgba(197, 165, 92, 0.1));
      border: 1px solid #C7A2A8;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1rem;
      text-align: center;
    }

    .upgrade-banner h4 {
      font-size: 15px;
      font-weight: 500;
      color: #7A8E8A;
      margin-bottom: 0.5rem;
    }

    .upgrade-banner a {
      display: inline-block;
      background: #C5A55C;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>Dein Nervensystem</h1>
    <p>Somatische Übungen für Ruhe & Kraft</p>
  </div>

  <div class="container">
    <div id="welcomeScreen">
      <div class="unlock-section">
        <h3>Willkommen bei ATEM-PAUSE</h3>
        <p style="margin: 1rem 0;">Gib deinen Code ein, um zu starten</p>
        <input type="text" id="codeInput" class="unlock-input" placeholder="Code eingeben" maxlength="20">
        <button class="unlock-button" onclick="unlockApp()">Freischalten</button>
        <p id="codeError" style="color: #C85A30; font-size: 13px; margin-top: 0.5rem;"></p>
        <p style="font-size: 12px; color: #B8949E; margin-top: 1rem;">
          <strong>Kein Code?</strong><br>
          <a href="https://carolinsemmelroth.com/deine-atem-pause" style="color: #C5A55C;">Hier gibt's deine App</a>
        </p>
      </div>
    </div>

    <div id="appScreen" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin: 1rem 0;">
        <h2 style="font-size: 18px; color: #7A8E8A;">Deine Übungen</h2>
        <button onclick="changeCode()" style="background: #E8F0ED; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;">Code ändern</button>
      </div>

      <div id="exercisesContainer"></div>

      <div class="upgrade-banner" id="upgradeBanner" style="display: none;">
        <h4>Du hast die INTRO-Version</h4>
        <p>100+ weitere Übungen warten auf dich – für jeden Moment, den du brauchst.</p>
        <a href="https://carolinsemmelroth.com/shop/atem-pause-upgrade-36" target="_blank">Zum Upgrade →</a>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modalImage" class="modal-image">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <p id="modalDescription" style="color: #B8949E; font-size: 13px; margin-bottom: 1rem;"></p>
      </div>
      <div id="modalDetails" style="font-size: 13px; color: #5A6B68; line-height: 1.6;"></div>
    </div>
  </div>

  <script>
    // INTRO ÜBUNGEN (12)
    const introExercises = [
      { id: 1, title: '01 Erdung – mit beiden Füßen ankommen', file: '01-erdung.png', duration: 3, category: 'Basis' },
      { id: 2, title: '02 Box Breathing – der 4-4-4-4 Rhythmus', file: '02-box-breathing.png', duration: 3, category: 'Atem' },
      { id: 3, title: '03 Die 5 Sinne – Jetzt-Verankerung', file: '03-5-sinne.png', duration: 5, category: 'Erdung' },
      { id: 4, title: '04 Erdungs-Atemzug – die Universal-Übung', file: '04-erdungs-atemzug.png', duration: 2, category: 'Basis' },
      { id: 5, title: '05 Schulter-Puls – Spannung lösen', file: '05-schulter-puls.png', duration: 4, category: 'Körper' },
      { id: 6, title: '06 Gegenpol-Berührung – Erwachen', file: '06-gegenpol-beruehrung.png', duration: 3, category: 'Körper' },
      { id: 7, title: '07 Anspannen & Loslassen', file: '07-anspannen-loslassen.png', duration: 5, category: 'Körper' },
      { id: 8, title: '08 4-7-8 Atem – der Einschlaf-Trick', file: '08-4-7-8-atem.png', duration: 3, category: 'Schlaf' },
      { id: 9, title: '09 Sanfte Bewegung – wieder lebendig', file: '09-sanfte-bewegung.png', duration: 4, category: 'Körper' },
      { id: 10, title: '10 Vagal Summen – Ruhe-Signal', file: '10-vagal-summen.png', duration: 3, category: 'Atem' },
      { id: 11, title: '11 Mama-Moment – Geduld zurückgewinnen', file: '11-mama-moment.png', duration: 2, category: 'Alltag' },
      { id: 12, title: '12 Fotografin-Mut – Kamera-Selbstbewusstsein', file: '12-fotografin-mut.png', duration: 3, category: 'Kraft' }
    ];

    // PREMIUM ÜBUNGEN (100) - SCAFFOLD
    const premiumExercises = [
      { id: 13, title: '13 Mein Kopf dreht sich – Fokus-Ankern', file: '13-fokus-ankern.png', duration: 4, category: 'Welt 1' },
      { id: 14, title: '14 Gedanken-Stopp – das Reset-Signal', file: '14-gedanken-stopp.png', duration: 2, category: 'Welt 1' },
      // ... (continue for all 100)
      // Scaffold-Struktur: Alle 100 mit Dateinamen aus Notion
      { id: 112, title: '112 Nacht-Ruhe', file: '112-nacht-ruhe.png', duration: 8, category: 'Welt 8' }
    ];

    // LAZY LOAD: Premium-Übungen generieren aus Dateinamen
    function generatePremiumScaffold() {
      const premiumData = [
        { id: 13, file: '13-fokus-ankern.png' },
        { id: 14, file: '14-gedanken-stopp.png' },
        { id: 15, file: '15-konzentrations-atem.png' },
        // ... (alle 100 mit Dateinamen)
        { id: 112, file: '112-nacht-ruhe.png' }
      ];
      
      return premiumData.map((ex, idx) => ({
        id: ex.id,
        title: `Übung ${ex.id}`,
        file: ex.file,
        duration: 3,
        category: 'Premium'
      }));
    }

    let allExercises = introExercises;
    let unlockedLevel = 'INTRO';

    function unlockApp() {
      const code = document.getElementById('codeInput').value.toUpperCase().trim();
      const errorEl = document.getElementById('codeError');
      
      if (code === 'INTRO2024') {
        unlockedLevel = 'INTRO';
        localStorage.setItem('atem_unlock_code', code);
        showApp();
      } else if (code === 'PRO2026') {
        unlockedLevel = 'PREMIUM';
        allExercises = [...introExercises, ...generatePremiumScaffold()];
        localStorage.setItem('atem_unlock_code', code);
        showApp();
      } else {
        errorEl.textContent = 'Code nicht erkannt. Versuche es nochmal.';
      }
    }

    function showApp() {
      document.getElementById('welcomeScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('upgradeBanner').style.display = unlockedLevel === 'INTRO' ? 'block' : 'none';
      renderExercises();
    }

    function renderExercises() {
      const container = document.getElementById('exercisesContainer');
      let html = '';

      allExercises.forEach(ex => {
        const isLocked = unlockedLevel === 'INTRO' && ex.id > 12;
        html += `
          <div class="exercise-card ${isLocked ? 'locked' : ''}" onclick="${isLocked ? '' : `openExercise(${ex.id})`}">
            <h3>${ex.title}</h3>
            <p>${ex.category} • ${ex.duration} Min</p>
            ${isLocked ? '<p style="color: #C85A30;">🔒 Premium</p>' : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function openExercise(id) {
      const ex = allExercises.find(e => e.id === id);
      if (!ex) return;

      document.getElementById('modalTitle').textContent = ex.title;
      document.getElementById('modalDescription').textContent = `${ex.category} • ${ex.duration} Minuten`;
      document.getElementById('modalImage').src = `/public/images/exercises/${ex.file}`;
      document.getElementById('modalDetails').innerHTML = `<p>Folge den Anweisungen auf dem Bild. ${ex.duration} Minuten für dich selbst.</p>`;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function changeCode() {
      localStorage.removeItem('atem_unlock_code');
      document.getElementById('welcomeScreen').style.display = 'block';
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('codeInput').value = '';
    }

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('atem_unlock_code');
      if (saved) {
        if (saved === 'INTRO2024') {
          unlockedLevel = 'INTRO';
          showApp();
        } else if (saved === 'PRO2026') {
          unlockedLevel = 'PREMIUM';
          allExercises = [...introExercises, ...generatePremiumScaffold()];
          showApp();
        }
      }
    });

    // PWA: Service Worker
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('/service-worker.js').catch(e => console.log('SW:', e.message));
    }

    // PWA: Install Prompt
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      const btn = document.createElement('button');
      btn.textContent = '📱 Zur Startseite hinzufügen';
      btn.style.cssText = 'padding:10px 16px; background:#C5A55C; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px; margin:1rem 0;';
      btn.onclick = () => e.prompt();
      document.querySelector('.app-header').appendChild(btn);
    });
  </script>
</body>
</html>
